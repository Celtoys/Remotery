name: Build

on: [push, pull_request_target]

jobs:

  build-linux:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        platform: ['linux']
        arch: ['x86', 'x64']

    steps:
      - uses: actions/checkout@v4
      - name: Install 32 bit support
        run: sudo apt-get install gcc-multilib g++-multilib

      - name: Build
        run: .github/scripts/compile.sh ${{ matrix.platform }} ${{ matrix.arch }} ${{ matrix.buildmode }}
      - name: Run
        run: .github/scripts/run_tests.sh

  build-macos:
    runs-on: macos-latest

    strategy:
      matrix:
        platform: ['linux']
        arch: ['x64']
        buildmode: ['release']

    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: .github/scripts/compile.sh ${{ matrix.platform }} ${{ matrix.arch }} ${{ matrix.buildmode }}
      - name: Run
        run: .github/scripts/run_tests.sh

  build-windows:
    runs-on: 'windows-latest'

    strategy:
      matrix:
        platform: ['windows']
        arch: ['x86', 'x64']
        buildmode: ['debug', 'release']

    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}
      - name: Build
        run: .github/scripts/compile.bat ${{ matrix.platform }} ${{ matrix.arch }} ${{ matrix.buildmode }}
      - name: Run
        run: .github/scripts/run_tests.bat

  build-android:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        platform: ['android']
        arch: ['armv7', 'arm64']
        buildmode: ['release']
        ndkversion: [21]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin' # See 'Supported distributions' for available options
          java-version: '17'

      # Sets ANDROID_HOME + ANDROID_NDK_ROOT
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build
        run: .github/scripts/compile.sh ${{ matrix.platform }} ${{ matrix.arch }} ${{ matrix.buildmode }}
        env:
          ANDROID_NDK_API_VERSION: ${{ matrix.ndkversion }}

      # - name: Run
      #   run: .github/scripts/run_tests.sh


